# SPDX-License-Identifier: GPL-3.0-or-later
#
# DSD as a codec module -- which is a word src/lib.rs has to earn, since
# nothing here decodes anything. The packing is the `dop` crate in packer/.

[package]
name = "mp_codec_dsd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "DSD for MediaPerch: the file's own bits, framed as DoP so a Windows endpoint can carry them"

[lib]
name = "mp_codec_dsd"
crate-type = ["cdylib"]

[dependencies]
mp-abi = { path = "../../shared/mp-abi" }
dop = { path = "packer" }
