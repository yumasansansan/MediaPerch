# SPDX-License-Identifier: GPL-3.0-or-later
#
# AAC-LC, written here, in Rust. See decoder/src/lib.rs for why it is written at
# all and src/lib.rs for what the module adds to the decoder.
#
# Only the .dll: the decoder is the `aac` crate in decoder/, which the tests
# and the fuzz target reach directly, so nothing here needs to be linkable.

[package]
name = "mp_codec_aac"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "AAC-LC for MediaPerch: an AudioSpecificConfig and packets in, float out, framed as the container says"

[lib]
name = "mp_codec_aac"
crate-type = ["cdylib"]

[dependencies]
mp-abi = { path = "../../shared/mp-abi" }
aac = { path = "decoder" }
