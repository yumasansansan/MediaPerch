# SPDX-License-Identifier: GPL-3.0-or-later
#
# The DSF and DSDIFF readers under libFuzzer. Its own package, outside the
# workspace, for the reason the other fuzz crates give: libfuzzer-sys is a
# crates.io dependency and a module build must not depend on it resolving.

[package]
name = "mp_demux_dsd_fuzz"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
dsdfile = { path = "../reader" }

[[bin]]
name = "dsd_fuzzer"
path = "fuzz_targets/dsd.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
panic = "abort"
overflow-checks = true
codegen-units = 1

[workspace]

[build-dependencies]
cc = "1"
