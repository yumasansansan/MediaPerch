# SPDX-License-Identifier: GPL-3.0-or-later
#
# The DSF and DSDIFF readers, and nothing else: no ABI, no file, no dependency.
# They walk any `Read + Seek`, so the tests and the fuzz target hand them a
# `Cursor` over bytes and the module hands them a file. Its own crate so that
# `#![forbid(unsafe_code)]` is a crate-level fact the compiler enforces.

[package]
name = "dsdfile"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "DSF and DSDIFF read from any seekable stream, in safe Rust: byte-interleaved MSB-first DSD out of either"

[lib]
name = "dsdfile"
crate-type = ["rlib"]

[dependencies]
