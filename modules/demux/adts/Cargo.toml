# SPDX-License-Identifier: GPL-3.0-or-later
#
# Raw AAC in ADTS framing, as a container module, in Rust -- the first
# container in the tree that is. See framer/src/lib.rs for the framing and
# src/lib.rs for the module around it.

[package]
name = "mp_demux_adts"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "ADTS for MediaPerch: the frame headers, and the AudioSpecificConfig an MP4 would have carried, assembled from the first of them"

[lib]
name = "mp_demux_adts"
crate-type = ["cdylib"]

[dependencies]
mp-abi = { path = "../../shared/mp-abi" }
adts = { path = "framer" }
