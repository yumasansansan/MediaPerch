# SPDX-License-Identifier: GPL-3.0-or-later
#
# Every fuzz target, for minutes rather than seconds, every night.
#
# CI's `fuzz` job gives each target thirty seconds on every push: a smoke test
# that the campaign still builds, with the regression corpus in it. That is not
# a campaign, and the faults a campaign finds were not found by it -- the
# demuxer fuzzers' first three minutes each found a read after free in the
# WavPack demuxer and a Bento4 loop that outlasted its twenty-second limit.
# This runs the same tests (fuzz/RunFuzzer.cmake) for as long as it is asked,
# on the corpus the last night grew, and keeps the corpus it grows and every
# input that failed.
name: Fuzz
run-name: Fuzz, ${{ github.event.inputs.minutes || '10' }} minutes each

on:
  schedule:
    - cron: '43 18 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: How long to fuzz each target
        type: choice
        default: '10'
        options: ['1', '5', '10', '15', '20']

permissions:
  contents: read
  actions: read

# One campaign at a time: the next one starts from this one's corpus.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: ${{ matrix.part }}, ${{ github.event.inputs.minutes || '10' }} minutes each
    runs-on: windows-2025-vs2026
    # The build, and ten targets at most at the longest time each, with room.
    timeout-minutes: >-
      ${{ fromJSON('{"1": 60, "5": 110, "10": 160, "15": 210, "20": 260}')[github.event.inputs.minutes || '10'] }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The demuxer modules through the ABI, seven of them.
          - part: demuxers
            select: -R ^fuzz_demux_
          # The audio codec modules through the ABI, five of them.
          - part: codecs
            select: -R ^fuzz_codec_
          # The parsers under them and the settings file, six in C++ and four
          # in Rust.
          - part: parsers
            select: -E "^fuzz_(demux|codec)_"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: LLVM, pinned
        shell: bash
        run: bash ci/setup.sh

      # For the runner's own processor, as CI's fuzz job is: nothing built here
      # leaves this job but what it finds.
      - name: Configure
        run: cmake --preset fuzz -DMEDIAPERCH_ARCH=native

      - name: Report the toolchain
        run: |
          Get-Content build/fuzz/llvm-toolchain.txt
          cmake -N -L build/fuzz | Select-String -Pattern 'MEDIAPERCH_ARCH'

      - name: Build
        run: cmake --build --preset fuzz

      # The corpus the last campaign grew, where there was one: a night that
      # starts from the seed inputs spends its first minutes finding again what
      # the one before had already found.
      - name: Carry over the corpus
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p fuzz-run/corpora
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow fuzz.yml --branch main \
            --status completed --limit 20 --json conclusion,databaseId \
            --jq '[.[] | select(.conclusion == "success" or .conclusion == "failure")][0].databaseId // empty')
          if [ -z "$last" ]; then
            echo "No earlier run: the corpus starts from the seed inputs."
            exit 0
          fi
          echo "Carrying over from run $last."
          gh run download "$last" --repo "$GITHUB_REPOSITORY" --dir fuzz-run/corpora \
            --name "fuzz-corpora-${{ matrix.part }}" \
            || echo "Run $last kept no corpus: the corpus starts from the seed inputs."

      # Each target for the minutes asked, in turn; ctest's own limit is the
      # run's length and ten minutes more, so that only a fuzzer that will not
      # stop is stopped by it. A hang inside one input is a finding of the
      # fuzzer's own, at twenty-five seconds (fuzz/CMakeLists.txt).
      - name: Fuzz each target
        env:
          MEDIAPERCH_FUZZ_CORPORA: ${{ github.workspace }}/fuzz-run/corpora
          MEDIAPERCH_FUZZ_FINDINGS: ${{ github.workspace }}/fuzz-run/findings
        run: |
          $seconds = [int]('${{ github.event.inputs.minutes || '10' }}') * 60
          $env:MEDIAPERCH_FUZZ_SECONDS = "$seconds"
          ctest --preset fuzz ${{ matrix.select }} --timeout ($seconds + 600) --output-on-failure

      - name: Keep the corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpora-${{ matrix.part }}
          path: fuzz-run/corpora/
          if-no-files-found: ignore
          retention-days: 30

      - name: Keep the inputs that failed
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings-${{ matrix.part }}
          path: fuzz-run/findings/
          if-no-files-found: ignore
          retention-days: 90
