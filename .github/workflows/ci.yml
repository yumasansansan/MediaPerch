name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job here uses a Ninja preset, and the Ninja generator does not go looking
# for Visual Studio the way the VS generator does. Without a developer
# environment CMake takes whatever `cc` is on PATH, which on this image is MinGW
# GCC at C:\mingw64\bin -- and then everything builds, cleanly, with nothing in
# the log admitting the toolchain was wrong.
#
# So each job sets the environment up first, using vswhere and vcvars64.bat, both
# of which ship with the image. MEDIAPERCH_EXPECT_TOOLSET in the presets is the
# backstop: if this step ever silently stops working, configuration fails loudly
# instead of quietly building with the wrong compiler.
env:
  VS_DEV_ENV: |
    for /f "usebackq tokens=*" %%i in (`vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
    if not defined VSPATH exit /b 1
    call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" >nul || exit /b 1
    >>"%GITHUB_ENV%" echo PATH=%PATH%
    >>"%GITHUB_ENV%" echo INCLUDE=%INCLUDE%
    >>"%GITHUB_ENV%" echo LIB=%LIB%
    >>"%GITHUB_ENV%" echo LIBPATH=%LIBPATH%

jobs:
  # The rule that src/core is portable is only worth something if something
  # checks it. This job builds the core with the platform head switched off and
  # runs the purity check, so the day an OS header appears in there is the day
  # this goes red -- not eighteen months later when a Linux head is attempted.
  core-alone:
    name: core alone, no platform head
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: MSVC developer environment
        shell: cmd
        run: ${{ env.VS_DEV_ENV }}

      - name: Configure
        run: cmake --preset core-only

      - name: Build the core, and nothing else
        run: cmake --build --preset core-only --target mediaperch_core

      - name: Check that the core is still portable
        run: >
          cmake -D MEDIAPERCH_CORE_DIR=${{ github.workspace }}/src/core
          -P cmake/CorePurity.cmake

  # The ABI header is compiled as C here as well as C++ (tests/abi_header_c.c),
  # so a C++-ism creeping into it fails the build rather than a third party's.
  msvc:
    name: MSVC, build and test
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, RelWithDebInfo]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: MSVC developer environment
        shell: cmd
        run: ${{ env.VS_DEV_ENV }}

      - name: Configure
        run: cmake --preset ninja-msvc

      - name: Report which compiler was actually used
        run: >
          cmake -N -L build/ninja-msvc |
          Select-String -Pattern 'CMAKE_CXX_COMPILER|MEDIAPERCH_EXPECT_TOOLSET'

      - name: Build
        run: cmake --build --preset ninja-msvc --config ${{ matrix.configuration }}

      - name: Test
        run: >
          ctest --preset ninja-msvc --build-config ${{ matrix.configuration }}
          --output-on-failure --no-tests=error

  # Every parser that reads a file somebody else wrote, given bytes nobody wrote.
  #
  # §2 chose C++ over Rust for the parsers on the argument that libFuzzer and the
  # sanitizers close the gap. That argument is worth nothing unless the fuzzer
  # actually runs, so it runs here, on every push, rather than by hand once a
  # year. Thirty seconds a target is not a campaign -- it is a smoke test that
  # the campaign still builds, and a place for a regression corpus to live.
  fuzz:
    name: fuzz the parsers
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: MSVC developer environment
        shell: cmd
        run: ${{ env.VS_DEV_ENV }}

      - name: Configure
        run: cmake --preset fuzz

      - name: Build
        run: cmake --build --preset fuzz

      - name: Fuzz
        run: ctest --preset fuzz

      # Whatever the run found that the corpus did not already cover. Worth
      # keeping even when nothing crashed: it is the next run's starting point.
      - name: Keep the crashes and the new corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: |
            build/fuzz/bin/crash-*
            build/fuzz/bin/leak-*
            build/fuzz/bin/timeout-*
          if-no-files-found: ignore

  # Every other check in this tree compares one decoder with another, which can
  # only say whether they agree. This one holds each decoder against the
  # uncompressed audio that went into the encoder: length, alignment, which
  # channel came out of which speaker, per-band energy, and a fidelity floor
  # that assumes nothing about FFmpeg -- plus the one thing the source cannot
  # check, which is agreement with FFmpeg sample for sample.
  #
  # It runs on every push because the three bugs it was built after were all
  # invisible to a build and to a unit test: a decoder that starts a track a
  # frame late, one that puts two channels in the wrong speakers, and one that
  # fills noise bands from a generator two frames out of step. Each of those
  # produced a file that decoded, was the right length in two cases out of
  # three, and sounded plausible.
  quality:
    name: decoders against the audio that was encoded
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # FFmpeg is a test tool here and nothing else: it builds the corpus and it
      # is the second opinion. Nothing in the product links it, and
      # decode_ffmpeg looks for it at run time rather than being built against
      # it -- so this installs a tool, not a dependency. It goes before the
      # developer environment because that step captures PATH into GITHUB_ENV,
      # and a PATH captured before an install is a PATH without it.
      - name: FFmpeg, for the corpus and the second opinion
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          # Logged on purpose: this job's thresholds are measurements, and the
          # encoder that produced the corpus is half of what was measured. The
          # day a row moves, the first question is whether this line changed.
          ffmpeg -version | Select-Object -First 1

      - name: MSVC developer environment
        shell: cmd
        run: ${{ env.VS_DEV_ENV }}

      - name: Configure
        run: cmake --preset ninja-msvc -D MEDIAPERCH_REQUIRE_FFMPEG=ON

      - name: Build
        run: cmake --build --preset ninja-msvc --config RelWithDebInfo

      # MEDIAPERCH_REQUIRE_FFMPEG turns a missing FFmpeg from a skip into a
      # failure, so the day this stops finding it is the day the job goes red
      # rather than the day it quietly starts checking nothing.
      - name: Measure
        run: >
          ctest --preset ninja-msvc --build-config RelWithDebInfo
          -R decode_quality --output-on-failure --no-tests=error

  # A second compiler catches what the first lets through -- and clang is the one
  # with complete C23, so it is also what proves the ABI header is not quietly
  # relying on an MSVC extension. clang-cl still needs the MSVC headers and
  # libraries, so it needs the same developer environment.
  clang:
    name: clang-cl, build and test
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: MSVC developer environment
        shell: cmd
        run: ${{ env.VS_DEV_ENV }}

      - name: Configure
        run: cmake --preset ninja-clang

      - name: Build
        run: cmake --build --preset ninja-clang-debug

      - name: Test
        run: ctest --preset ninja-clang-debug
