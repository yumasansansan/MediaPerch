# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job here uses a Ninja preset, and the Ninja generator does not go looking
# for Visual Studio the way the VS generator does. Without a developer
# environment CMake takes whatever `cc` is on PATH, which on this image is MinGW
# GCC at C:\mingw64\bin -- and then everything builds, cleanly, with nothing in
# the log admitting the toolchain was wrong.
#
# So each job sets the environment up first, using vswhere and vcvars64.bat, both
# of which ship with the image. MEDIAPERCH_EXPECT_TOOLSET in the presets is the
# backstop: if this step ever silently stops working, configuration fails loudly
# instead of quietly building with the wrong compiler.
env:
  VS_DEV_ENV: |
    for /f "usebackq tokens=*" %%i in (`vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
    if not defined VSPATH exit /b 1
    call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" >nul || exit /b 1
    >>"%GITHUB_ENV%" echo PATH=%PATH%
    >>"%GITHUB_ENV%" echo INCLUDE=%INCLUDE%
    >>"%GITHUB_ENV%" echo LIB=%LIB%
    >>"%GITHUB_ENV%" echo LIBPATH=%LIBPATH%

jobs:
  # The rule that the portable half is portable is only worth something if
  # something
  # checks it. This job builds the core with the platform head switched off and
  # runs the purity check, so the day an OS header appears in there is the day
  # this goes red -- not eighteen months later when a Linux head is attempted.
  # **Two cuts, both checked here.** The engine has to build with no platform
  # head -- that is the portability claim -- and with no *player*, which is the
  # newer one: a transport, a playlist, a settings file and a wire protocol are
  # what a DAW would bring its own of, and until they were a separate library
  # taking the engine meant taking them too. Building `mediaperch_engine` alone
  # is what keeps that true, because the target does not have src/player on its
  # include path and a reach across it will not compile.
  core-alone:
    name: engine alone, no player and no platform head
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: MSVC developer environment
        shell: cmd
        run: ${{ env.VS_DEV_ENV }}

      - name: Configure
        run: cmake --preset core-only

      - name: Build the engine, and nothing else
        run: cmake --build --preset core-only --target mediaperch_engine

      - name: Build the player on top of it
        run: cmake --build --preset core-only --target mediaperch_player

      - name: Check that both are still portable
        run: >
          cmake "-D MEDIAPERCH_CORE_DIR=${{ github.workspace }}/src/engine;${{ github.workspace }}/src/player"
          -P cmake/CorePurity.cmake

  # The ABI header is compiled as C here as well as C++ (tests/abi_header_c.c),
  # so a C++-ism creeping into it fails the build rather than a third party's.
  # **Two instruction-set baselines, both shipped.**
  #
  # Nothing this tree links needs help -- libFLAC, libmpg123, libopus and
  # libwavpack each dispatch on the CPU internally. The code *here* does: the
  # resampler, the convolver, the FFT, the equaliser, the channel matrix and the
  # dither are Path B's inner loops and compile to the x86-64 baseline, which is
  # SSE2 and 2003. `avx2` is x86-64-v3 -- Haswell and Zen and later -- and a
  # binary built that way does not start without it, which is why both are built
  # and both are uploaded rather than one being chosen for everybody.
  msvc:
    name: MSVC, build and test
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, RelWithDebInfo, Release]
        arch: [baseline, avx2]
        include:
          - arch: baseline
            preset: ninja-msvc
          - arch: avx2
            preset: ninja-msvc-avx2
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # **dav1d builds with Meson and nothing else**, which makes it the one
      # submodule here CMake cannot build -- see modules/codec/dav1d. The image
      # has Ninja already and neither of the other two, so without this step
      # `codec_dav1d` is skipped by its own guard, the build stays green, and
      # the artifacts quietly have no AV1 decoder. A silent absence is exactly
      # what this repository does not do elsewhere, so it is installed rather
      # than shrugged at.
      #
      # Through the Miniconda the image ships rather than pip: both tools come
      # from one channel, which is also how the development machine gets them.
      # **Into a named environment rather than base**, for the same reason a
      # person would: base is shared, and a job that installs into it has an
      # opinion about every other job on the image. The name is the one
      # modules/codec/dav1d/CMakeLists.txt tells a person to create.
      # Before the developer environment on purpose -- that step captures PATH
      # into GITHUB_ENV, and a PATH captured before an install is a PATH
      # without it, which is the same reason the FFmpeg step in `quality` sits
      # where it does.
      - name: Meson and nasm, which build external/dav1d
        run: |
          & "$env:CONDA\Scripts\conda.exe" create -y -n mediaperch-build -c conda-forge meson nasm
          $root = "$env:CONDA\envs\mediaperch-build"
          Add-Content -Path $env:GITHUB_PATH -Value "$root\Scripts"
          Add-Content -Path $env:GITHUB_PATH -Value "$root\Library\bin"

      - name: MSVC developer environment
        shell: cmd
        run: ${{ env.VS_DEV_ENV }}

      # Stated out loud, because the module is skipped silently when they are
      # absent and a skipped decoder looks exactly like a passing build.
      - name: Report the tools external/dav1d needs
        run: |
          meson --version
          nasm -v
          ninja --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Report which compiler and which baseline were actually used
        run: >
          cmake -N -L build/${{ matrix.preset }} |
          Select-String -Pattern
          'CMAKE_CXX_COMPILER|MEDIAPERCH_EXPECT_TOOLSET|MEDIAPERCH_ARCH'

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.configuration }}

      - name: Test
        run: >
          ctest --preset ${{ matrix.preset }} --build-config ${{ matrix.configuration }}
          --output-on-failure --no-tests=error

      # The Release build of each baseline, so a person can take the one their
      # machine runs. The AVX2 one refuses to start on anything before Haswell,
      # which is the whole reason there are two.
      - name: Keep the Release build
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: mediaperch-${{ matrix.arch }}
          path: build/${{ matrix.preset }}/bin/Release
          if-no-files-found: error

  # Every parser that reads a file somebody else wrote, given bytes nobody wrote.
  #
  # §2 chose C++ over Rust for the parsers on the argument that libFuzzer and the
  # sanitizers close the gap. That argument is worth nothing unless the fuzzer
  # actually runs, so it runs here, on every push, rather than by hand once a
  # year. Thirty seconds a target is not a campaign -- it is a smoke test that
  # the campaign still builds, and a place for a regression corpus to live.
  fuzz:
    name: fuzz the parsers
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: MSVC developer environment
        shell: cmd
        run: ${{ env.VS_DEV_ENV }}

      - name: Configure
        run: cmake --preset fuzz

      - name: Build
        run: cmake --build --preset fuzz

      - name: Fuzz
        run: ctest --preset fuzz

      # Whatever the run found that the corpus did not already cover. Worth
      # keeping even when nothing crashed: it is the next run's starting point.
      - name: Keep the crashes and the new corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: |
            build/fuzz/bin/crash-*
            build/fuzz/bin/leak-*
            build/fuzz/bin/timeout-*
          if-no-files-found: ignore

  # Every other check in this tree compares one decoder with another, which can
  # only say whether they agree. This one holds each decoder against the
  # uncompressed audio that went into the encoder: length, alignment, which
  # channel came out of which speaker, per-band energy, and a fidelity floor
  # that assumes nothing about FFmpeg -- plus the one thing the source cannot
  # check, which is agreement with FFmpeg sample for sample.
  #
  # It runs on every push because the three bugs it was built after were all
  # invisible to a build and to a unit test: a decoder that starts a track a
  # frame late, one that puts two channels in the wrong speakers, and one that
  # fills noise bands from a generator two frames out of step. Each of those
  # produced a file that decoded, was the right length in two cases out of
  # three, and sounded plausible.
  quality:
    name: decoders against the audio that was encoded
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # FFmpeg is a test tool here and nothing else: it builds the corpus and it
      # is the second opinion. Nothing in the product links it, and
      # demux_ffmpeg looks for it at run time rather than being built against
      # it -- so this installs a tool, not a dependency. It goes before the
      # developer environment because that step captures PATH into GITHUB_ENV,
      # and a PATH captured before an install is a PATH without it.
      - name: FFmpeg, for the corpus and the second opinion
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          # Logged on purpose: this job's thresholds are measurements, and the
          # encoder that produced the corpus is half of what was measured. The
          # day a row moves, the first question is whether this line changed.
          ffmpeg -version | Select-Object -First 1

      - name: MSVC developer environment
        shell: cmd
        run: ${{ env.VS_DEV_ENV }}

      # Release, and with MEDIAPERCH_DIAGNOSTICS on so the measuring commands
      # are actually in the binary: a shipping build leaves them out, and this
      # job exists to use them. Release rather than Debug because the check
      # decodes about a minute of audio a dozen times over, and a Debug decoder
      # turns two minutes into twenty.
      - name: Configure
        run: >
          cmake --preset ninja-msvc
          -D MEDIAPERCH_REQUIRE_FFMPEG=ON -D MEDIAPERCH_DIAGNOSTICS=ON

      - name: Build
        run: cmake --build --preset ninja-msvc --config Release

      # MEDIAPERCH_REQUIRE_FFMPEG turns a missing FFmpeg -- or a build without
      # the measuring commands -- from a skip into a failure, so the day either
      # stops being true is the day the job goes red rather than the day it
      # quietly starts checking nothing.
      - name: Measure
        run: >
          ctest --preset ninja-msvc --build-config Release
          -R decode_quality --output-on-failure --no-tests=error

  # What actually ships: optimised, link-time optimised, no test suite and no
  # measuring apparatus. It is a separate job because it is a *different build* --
  # MEDIAPERCH_DIAGNOSTICS changes what is compiled, so a configuration that
  # never gets built is a configuration that will not compile one day.
  #
  # The sizes are printed rather than asserted. A threshold here would fail on
  # somebody else's toolchain update and teach everyone to raise it; a number in
  # the log is something a person can look at when a pull request doubles it.
  ship:
    name: the build that ships, and what it weighs
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # See the `msvc` job for why this is here and why it is before the
      # developer environment. Without it the shipping build has no AV1
      # decoder, and a size report that leaves one out is the wrong report.
      - name: Meson and nasm, which build external/dav1d
        run: |
          & "$env:CONDA\Scripts\conda.exe" create -y -n mediaperch-build -c conda-forge meson nasm
          $root = "$env:CONDA\envs\mediaperch-build"
          Add-Content -Path $env:GITHUB_PATH -Value "$root\Scripts"
          Add-Content -Path $env:GITHUB_PATH -Value "$root\Library\bin"

      - name: MSVC developer environment
        shell: cmd
        run: ${{ env.VS_DEV_ENV }}

      - name: Configure
        run: >
          cmake --preset ninja-msvc
          -D MEDIAPERCH_BUILD_TESTS=OFF -D MEDIAPERCH_LINK_MAP=ON

      - name: Build
        run: cmake --build --preset ninja-msvc --config Release

      - name: What it weighs
        run: |
          Get-ChildItem build/ninja-msvc/bin/Release -Include *.exe,*.dll -Recurse |
            Sort-Object Length -Descending |
            Format-Table @{n='KB';e={'{0,8:N1}' -f ($_.Length/1KB)}}, Name -AutoSize
          '{0:N1} KB total' -f ((Get-ChildItem build/ninja-msvc/bin/Release -Include *.exe,*.dll -Recurse |
            Measure-Object Length -Sum).Sum / 1KB)

      # Where those bytes came from, attributed to the object files that brought
      # them. Cheap to run and the only thing that turns "it got bigger" into a
      # name.
      - name: Where the bytes are
        run: |
          $maps = (Get-ChildItem build/ninja-msvc/bin/Release/*.map).FullName
          python tools/mapsize.py --top 8 @maps
